name: Daily Air Quality Feature Pipeline (Notebook Schedule)

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-feature-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Feature Pipeline Notebook via Papermill
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          papermill notebooks/2_daily_feature_pipeline.ipynb notebooks/2_daily_feature_pipeline_output.ipynb

      - name: Commit and Push Updated Notebook & Data Artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ notebooks/*_output.ipynb
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily feature pipeline notebook execution [skip ci]"
          git push || true
