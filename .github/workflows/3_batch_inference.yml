name: Daily Batch Inference & Forecast Graph Update (Notebook Schedule)

on:
  schedule:
    # Run daily at 01:00 UTC (after daily feature pipeline)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-batch-inference-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Batch Inference Pipeline Notebook
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          papermill notebooks/4_batch_inference_pipeline.ipynb notebooks/4_batch_inference_pipeline_output.ipynb

      - name: Commit Forecast JSON & Generated Graph for GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/latest_predictions.json docs/ notebooks/*_output.ipynb
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily batch forecast graph update [skip ci]"
          git push || true
