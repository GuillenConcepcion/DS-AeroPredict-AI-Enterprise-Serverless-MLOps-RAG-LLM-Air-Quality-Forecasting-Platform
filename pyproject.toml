[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-aeropredict-ai-enterprise-serverless-mlops"
version = "1.0.0"
description = "Enterprise-Grade Serverless MLOps Platform for Real-Time Air Quality Forecasting & Health Intelligence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Guillén Concepción", email = "guillenconcepcion@gmail.com" }
]
license = { text = "MIT" }
keywords = ["MLOps", "Hopsworks", "LightGBM", "Air-Quality", "RAG", "LLM", "Streamlit"]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
